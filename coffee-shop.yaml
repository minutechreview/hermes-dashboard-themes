name: coffee-shop
label: Coffee Shop
description: Warm café aesthetic with rich browns, creams, and amber accents

palette:
  background:
    hex: "#2b1d14"
    alpha: 1.0
  midground:
    hex: "#d4a574"
    alpha: 1.0
  foreground:
    hex: "#f5e6d3"
    alpha: 0.15
  warmGlow: "rgba(212, 165, 116, 0.25)"
  noiseOpacity: 0.3

typography:
  fontSans: '"Lora", "Georgia", serif'
  fontMono: '"JetBrains Mono", ui-monospace, monospace'
  fontDisplay: '"Lora", serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  baseSize: "16px"
  lineHeight: "1.7"
  letterSpacing: "0.01em"

layout:
  radius: "0.75rem"
  density: spacious

layoutVariant: standard

assets:
  bg: "none"

colorOverrides:
  primary: "#c8956c"
  primaryForeground: "#2b1d14"
  accent: "#e8c4a0"
  ring: "#d4a574"
  destructive: "#c45c5c"
  border: "rgba(212, 165, 116, 0.2)"
  muted: "#3d2b1f"
  mutedForeground: "#a0846a"
  secondary: "#4a3525"
  secondaryForeground: "#e8c4a0"
  success: "#7a9e7e"
  warning: "#d4a574"

componentStyles:
  card:
    background: "linear-gradient(180deg, rgba(61, 43, 31, 0.95), rgba(43, 29, 20, 0.98))"
    boxShadow: "0 2px 12px rgba(0, 0, 0, 0.25), inset 0 0 0 1px rgba(212, 165, 116, 0.12)"
    borderRadius: "0.75rem"
  header:
    background: "linear-gradient(180deg, rgba(43, 29, 20, 0.98), rgba(35, 24, 16, 0.95))"
    boxShadow: "0 1px 0 rgba(212, 165, 116, 0.1)"
  badge:
    background: "linear-gradient(135deg, #c8956c, #a07850)"
    color: "#2b1d14"

customCSS: |
  /* Warm ambient glow */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    background: 
      radial-gradient(ellipse at 50% 100%, rgba(212, 165, 116, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 20% 0%, rgba(200, 149, 108, 0.05) 0%, transparent 40%);
  }
  
  /* Elegant card hover effect */
  [class*="card"]:hover {
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(212, 165, 116, 0.18);
    transition: box-shadow 0.3s ease;
  }
  
  /* Serif headings */
  h1, h2, h3, h4 {
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  
  /* Subtle paper texture feel */
  ::-webkit-scrollbar {
    width: 10px;
  }
  ::-webkit-scrollbar-track {
    background: rgba(43, 29, 20, 0.8);
  }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #c8956c, #a07850);
    border-radius: 5px;
    border: 2px solid rgba(43, 29, 20, 0.8);
  }