name: india
label: India
description: Saffron, white, and green with Ashoka Chakra blue — the tricolor spirit

palette:
  background: "#1a2410"
  midground: "#ffffff"
  foreground: "#ff9932"
  warmGlow: "rgba(255, 153, 50, 0.15)"
  noiseOpacity: 0.3

typography:
  fontSans: '"Noto Sans Devanagari", "Inter", system-ui, sans-serif'
  fontMono: '"JetBrains Mono", ui-monospace, monospace'
  fontDisplay: '"Noto Sans Devanagari", sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  baseSize: "15px"
  lineHeight: "1.65"
  letterSpacing: "0.01em"

layout:
  radius: "0.5rem"
  density: comfortable

layoutVariant: standard

assets:
  bg: "none"

colorOverrides:
  primary: "#138808"
  primaryForeground: "#ffffff"
  accent: "#ff9932"
  ring: "#000080"
  destructive: "#d32f2f"
  border: "rgba(19, 136, 8, 0.25)"
  muted: "#263318"
  mutedForeground: "#8aaa6a"
  secondary: "#2a3a1a"
  secondaryForeground: "#ffd699"
  success: "#138808"
  warning: "#ff9932"

componentStyles:
  card:
    background: "linear-gradient(180deg, rgba(38, 51, 24, 0.95), rgba(26, 36, 16, 0.98))"
    boxShadow: "0 2px 8px rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(255, 153, 50, 0.08)"
    borderRadius: "0.5rem"
  header:
    background: "linear-gradient(180deg, #ff9932 0%, #ffffff 33%, #138808 66%, rgba(26, 36, 16, 0.98) 100%)"
    backgroundSize: "100% 4px"
    backgroundRepeat: "no-repeat"
    backgroundPosition: "top"
    boxShadow: "0 1px 0 rgba(19, 136, 8, 0.2)"
  badge:
    background: "linear-gradient(135deg, #138808, #0d6b05)"
    color: "#ffffff"

customCSS: |
  /* Tricolor ambient glow */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    background: 
      radial-gradient(ellipse at 50% 0%, rgba(255, 153, 50, 0.06) 0%, transparent 40%),
      radial-gradient(ellipse at 50% 100%, rgba(19, 136, 8, 0.05) 0%, transparent 40%);
  }
  
  /* Chakra-inspired ring on active elements */
  [aria-selected="true"], button[class*="primary"] {
    position: relative;
  }
  [aria-selected="true"]::after, button[class*="primary"]::after {
    content: "";
    position: absolute;
    inset: -2px;
    border: 1px solid rgba(0, 0, 128, 0.3);
    border-radius: inherit;
    pointer-events: none;
  }
  
  /* Saffron accent on hover */
  [class*="card"]:hover {
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 153, 50, 0.15);
    transition: all 0.3s ease;
  }