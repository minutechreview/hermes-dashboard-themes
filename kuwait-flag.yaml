name: kuwait-flag
label: Kuwait Flag
description: Bold Kuwait national colors — red, green, white, and black with geometric Gulf-inspired accents

palette:
  background: "#0a0a0a"
  midground: "#ffffff"
  foreground: "#ce1126"
  warmGlow: "rgba(206, 17, 38, 0.15)"
  noiseOpacity: 0.3

typography:
  fontSans: '"Noto Sans Arabic", "Inter", system-ui, sans-serif'
  fontMono: '"JetBrains Mono", ui-monospace, monospace'
  fontDisplay: '"Noto Sans Arabic", sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  baseSize: "15px"
  lineHeight: "1.6"
  letterSpacing: "0.01em"

layout:
  radius: "0.25rem"
  density: comfortable

layoutVariant: standard

assets:
  bg: "none"

colorOverrides:
  primary: "#007a3d"
  primaryForeground: "#ffffff"
  accent: "#ce1126"
  ring: "#007a3d"
  destructive: "#ce1126"
  border: "rgba(0, 122, 61, 0.3)"
  muted: "#1a1a1a"
  mutedForeground: "#888888"
  secondary: "#2a2a2a"
  secondaryForeground: "#eeeeee"
  success: "#007a3d"
  warning: "#e8c547"

componentStyles:
  card:
    background: "linear-gradient(180deg, rgba(20, 20, 20, 0.95), rgba(10, 10, 10, 0.98))"
    boxShadow: "0 1px 0 rgba(0, 122, 61, 0.25) inset, 0 2px 8px rgba(0, 0, 0, 0.3)"
    borderRadius: "0.25rem"
  header:
    background: "linear-gradient(180deg, rgba(10, 10, 10, 0.98), rgba(5, 5, 5, 0.95))"
    boxShadow: "0 2px 0 rgba(206, 17, 38, 0.3)"
  badge:
    background: "linear-gradient(135deg, #007a3d, #005c2e)"
    color: "#ffffff"

customCSS: |
  /* Subtle Kuwaiti geometric pattern border */
  [class*="card"]::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, #007a3d 33%, #ffffff 33%, #ffffff 66%, #ce1126 66%);
    opacity: 0.6;
    pointer-events: none;
  }
  
  /* Red accent on headings */
  h1, h2 {
    color: #ffffff;
    text-shadow: 0 0 20px rgba(206, 17, 38, 0.15);
  }