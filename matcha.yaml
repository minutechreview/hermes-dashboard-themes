name: matcha
label: Matcha
description: Calm Japanese tea shop aesthetic with soft greens and warm cream accents

palette:
  background: "#1a2f1a"
  midground: "#a8d5a2"
  foreground: "#f5f5dc"
  warmGlow: "rgba(168, 213, 162, 0.15)"
  noiseOpacity: 0.4

typography:
  fontSans: '"Zen Kaku Gothic New", "Noto Sans JP", system-ui, sans-serif'
  fontMono: '"JetBrains Mono", ui-monospace, monospace'
  fontDisplay: '"Zen Kaku Gothic New", sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
  baseSize: "15px"
  lineHeight: "1.65"
  letterSpacing: "0.02em"

layout:
  radius: "0.5rem"
  density: comfortable

layoutVariant: standard

assets:
  bg: "none"

colorOverrides:
  primary: "#6b9b6b"
  primaryForeground: "#1a2f1a"
  accent: "#d4c4a8"
  ring: "#a8d5a2"
  destructive: "#c45c5c"
  border: "rgba(168, 213, 162, 0.2)"

componentStyles:
  card:
    boxShadow: "0 2px 8px rgba(0, 0, 0, 0.15), inset 0 0 0 1px rgba(168, 213, 162, 0.12)"
    background: "linear-gradient(180deg, rgba(30, 50, 30, 0.9), rgba(20, 35, 20, 0.95))"
  header:
    background: "linear-gradient(180deg, rgba(26, 47, 26, 0.98), rgba(20, 35, 20, 0.95))"
    boxShadow: "0 1px 0 rgba(168, 213, 162, 0.1)"

customCSS: |
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    background: 
      radial-gradient(ellipse at 20% 80%, rgba(107, 155, 107, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(212, 196, 168, 0.06) 0%, transparent 50%);
  }