name: sakura-bloom
label: Sakura Bloom
description: Soft cherry blossom pinks with warm cream and rose gold accents

palette:
  background:
    hex: "#1a0f14"
    alpha: 1.0
  midground:
    hex: "#ffb7c5"
    alpha: 1.0
  foreground:
    hex: "#fff0f5"
    alpha: 0.25
  warmGlow: "rgba(255, 183, 197, 0.3)"
  noiseOpacity: 0.35

typography:
  fontSans: "Quicksand, system-ui, sans-serif"
  fontMono: "Fira Code, ui-monospace, monospace"
  fontDisplay: "Quicksand, system-ui, sans-serif"
  fontUrl: "https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
  baseSize: "15px"
  lineHeight: "1.6"
  letterSpacing: "0.01em"

layout:
  radius: "1rem"
  density: comfortable

colorOverrides:
  primary: "#ffb7c5"
  primaryForeground: "#1a0f14"
  accent: "#ffd700"
  accentForeground: "#1a0f14"
  destructive: "#ff6b81"
  ring: "#ffb7c5"
  muted: "#2a1a22"
  mutedForeground: "#d4a5b0"
  border: "#3a2530"
