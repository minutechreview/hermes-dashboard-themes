name: saudi-arabia
label: Saudi Arabia
description: Kingdom green with white and gold — inspired by the Saudi national flag

palette:
  background: "#0a1f0a"
  midground: "#ffffff"
  foreground: "#d4af37"
  warmGlow: "rgba(212, 175, 55, 0.15)"
  noiseOpacity: 0.25

typography:
  fontSans: '"Noto Sans Arabic", "Inter", system-ui, sans-serif'
  fontMono: '"JetBrains Mono", ui-monospace, monospace'
  fontDisplay: '"Noto Sans Arabic", sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  baseSize: "15px"
  lineHeight: "1.6"
  letterSpacing: "0.01em"

layout:
  radius: "0.5rem"
  density: comfortable

layoutVariant: standard

assets:
  bg: "none"

colorOverrides:
  primary: "#006c35"
  primaryForeground: "#ffffff"
  accent: "#d4af37"
  ring: "#006c35"
  destructive: "#c62828"
  border: "rgba(0, 108, 53, 0.3)"
  muted: "#152615"
  mutedForeground: "#7a9e7a"
  secondary: "#1f3a1f"
  secondaryForeground: "#c8e6c9"
  success: "#2e7d32"
  warning: "#d4af37"

componentStyles:
  card:
    background: "linear-gradient(180deg, rgba(21, 38, 21, 0.95), rgba(10, 31, 10, 0.98))"
    boxShadow: "0 2px 8px rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(0, 108, 53, 0.15)"
    borderRadius: "0.5rem"
  header:
    background: "linear-gradient(180deg, rgba(10, 31, 10, 0.98), rgba(8, 25, 8, 0.95))"
    boxShadow: "0 1px 0 rgba(0, 108, 53, 0.2)"
  badge:
    background: "linear-gradient(135deg, #006c35, #004d26)"
    color: "#ffffff"

customCSS: |
  /* Islamic geometric pattern subtle overlay */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    background: 
      radial-gradient(circle at 50% 50%, rgba(0, 108, 53, 0.04) 0%, transparent 60%);
  }
  
  /* Gold accent on hover */
  [class*="card"]:hover {
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(212, 175, 55, 0.15);
    transition: all 0.3s ease;
  }
  
  /* Elegant scrollbar */
  ::-webkit-scrollbar {
    width: 8px;
  }
  ::-webkit-scrollbar-track {
    background: rgba(10, 31, 10, 0.8);
  }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #006c35, #004d26);
    border-radius: 4px;
  }